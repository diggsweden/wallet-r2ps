name: r2ps-dev

services:

  r2ps-demo-client:
    image: rhsm-client
    ports:
      - "9000:8080"
      - "9002:8000"
    restart: on-failure
    volumes:
      - ./r2ps-demo-client/resources:/resources
      - ./r2ps-demo-client/demo:/demo
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: /config/
      SPRING_PROFILES_ACTIVE: demo
      RPS_OPS_CLIENT_SERVER_URL: http://r2ps-rest-api:8088
      SERVER_PORT: 8080
      SERVER_SSL_ENABLED: "false"
      TZ: "Europe/Stockholm"
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true -XX:UseSVE=0"
    networks:
      - wallet-network

  r2ps-rest-api:
    build:
      context: .
      dockerfile: ./r2ps-rest-api/Containerfile
    ports:
      - "8088:8088"
      - "9012:8000"
    restart: on-failure
    depends_on:
      - kafka
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      SPRING_DATA_REDIS_HOST: "valkey"
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_USERNAME: "default"
      SPRING_DATA_REDIS_PASSWORD: "secret"
      SPRING_DATA_REDIS_DATABASE: 0
      TZ: "Europe/Stockholm"
    env_file: .env
    networks:
      - wallet-network

  r2ps-worker:
    profiles:
      - old-java
    build:
      context: .
      dockerfile: ./r2ps-worker/Containerfile
    ports:
      - "9020:8443"
      - "9022:8000"
    restart: on-failure
    depends_on:
      - kafka
    volumes:
      - ./r2ps-worker/target/test-data:/target/test-data
      - ./demo:/demo
      - ./filestorage:/app/filestorage
      - ./foo:/app/foo
    env_file: .env
    environment:
      SERVER_PORT: 8099
      #SPRING_CONFIG_ADDITIONAL_LOCATION: /config/
      SPRING_PROFILES_ACTIVE: hsm,demo
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      SPRING_KAFKA_BOOTSTRAP-SERVERS: "kafka:29092"
      SPRING_DATA_REDIS_HOST: "valkey"
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_USERNAME: "default"
      SPRING_DATA_REDIS_PASSWORD: "secret"
      SPRING_DATA_REDIS_DATABASE: 0
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wallet
      SPRING_DATASOURCE_USERNAME: walletuser
      SPRING_DATASOURCE_PASSWORD: s3cret
      RPS_OPS_CLIENT_REGISTRY_INIT_DIRECTORY: /app/filestorage/dev
      TZ: "Europe/Stockholm"
    networks:
      - wallet-network

  rust-r2ps-worker:
    build:
      context: ./rust-r2ps-worker
      dockerfile: Containerfile
    env_file:
      - ./rust-r2ps-worker/.env
    environment:
      RUST_LOG: info
      BOOTSTRAP_SERVERS: "kafka:29092"
    depends_on:
      - kafka
    networks:
      - wallet-network

  valkey:
    image: valkey/valkey:8.0.2-alpine3.21
    ports:
      - 6379:6379
    command: [ "valkey-server", "/usr/local/etc/valkey/valkey.conf" ]
    volumes:
      - ./config/valkey.conf:/usr/local/etc/valkey/valkey.conf
    networks:
      - wallet-network

  kafka:
    image: apache/kafka-native:latest
    container_name: r2ps-dev-kafka-1
    environment:
      # KRaft mode requires CLUSTER_ID
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Simplified listener configuration
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Replication settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

      # Important: Specify log directory
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    tmpfs:
      - /var/lib/kafka/data:uid=1000,gid=1000
#    volumes:
#      - kafka-data:/var/lib/kafka/data
    networks:
      - wallet-network
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Optional: Kafka UI for management
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - wallet-network
  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: s3cret
      POSTGRES_DB: wallet
      POSTGRES_USER: walletuser
    ports:
      - "5432:5432"
    networks:
      - wallet-network

#volumes:
#  kafka-data:
#    driver: local

networks:
  wallet-network:
    driver: bridge
