name: OpenSSF Scorecard Analysis

on:
  push:
    branches:
      - main
  schedule:
    # Saturdays at 02:40 UTC
    - cron: "40 2 * * 6"
    # Wednesdays at 02:40 UTC
    - cron: "40 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read # Best Security practice. Jobs only get read as base, and then permissions are added as needed

jobs:
  scorecard-analysis:
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: diggsweden/reusable-ci/.github/workflows/security-openssf-scorecard.yml@1a76b0c1a69952742ea663c8cfe77d8fe1d168ad # v3.1.0
    secrets:
      CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
    with:
      reusable-ci-ref: 997d7dc2238b40c79798fda309d8061b0707a3e5 # v3.0.0
      publish-results: true
