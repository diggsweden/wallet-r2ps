[package]
name = "rust-r2ps-worker"
version = "0.1.0"
edition = "2024"
default-run = "hsm-worker"

[lib]
name = "rust_r2ps_worker"
path = "src/lib.rs"

[[bin]]
name = "generate_openapi"
path = "src/generate_openapi.rs"
required-features = ["openapi"]

[[bin]]
name = "hsm-worker"
path = "src/main.rs"

[features]
openapi = ["dep:utoipa"]

[dependencies]
rdkafka = { version = "0.38.0", features = ["cmake-build", "curl-static"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ctrlc = { version = "3.4", features = ["termination"] }
dotenvy = "0.15.7"
config = "0.15.19"
moka = { version = "0.12", features = ["sync"] }
strum_macros = "0.27.2"
cryptoki = "0.10.0"
opaque-ke = { version = "4.0.1", features = ["std"] }
rand = "0.8"
sha2 = "0.10.9"
josekit = "0.10.3"
base64 = "0.22.1"
p256 = { version = "0.13", default-features = false, features = [
    "ecdsa",
    "hash2curve",
    "pkcs8",
    "voprf",
    "pem",
    "ecdh",
    "jwk",
] }
elliptic-curve = { version = "0.13", features = ["sec1", "jwk"] }
pem = "3"
der = "0.7.10"
argon2 = { version = "0.5", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
digest = "0.10.7"
hex = "0.4.3"
utoipa = { version = "5", features = ["uuid"], optional = true }
spki = "0"
iso8601-duration = { version = "0.2.0", features = ["serde"] }
problem_details = "0.9.0"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
redb = "2"
clap = { version = "4", features = ["derive"] }
num_cpus = "1"
