[package]
name = "wallet-bff"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wallet-bff"
path = "src/main.rs"

[features]
testcontainers = []

[dependencies]
hsm-common = { path = "../hsm-common", features = ["openapi"] }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
rdkafka = { version = "0.39.0", features = ["cmake-build", "curl-static", "tokio"] }
redis = { version = "1.0", features = ["tokio-comp", "connection-manager", "sentinel"] }
arc-swap = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32" }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry-http = "0.32"
dotenvy = "0.15.7"
config = "0.15.19"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
iso8601-duration = { version = "0.2.0", features = ["serde"] }
async-trait = "0.1"
utoipa = { version = "5", features = ["uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
tower-http = { version = "0.6", features = ["trace"] }

[dev-dependencies]
uuid = { version = "=1.23.3", features = ["v4"] }
rstest = "=0.26.1"
tower = { version = "=0.5.3", features = ["util"] }
testcontainers = "=0.27.3"
testcontainers-modules = { version = "=0.15.0", features = ["kafka", "valkey"] }
base64 = "=0.22.1"
