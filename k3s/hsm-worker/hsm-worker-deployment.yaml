---
# Secret for .env.softhsm
apiVersion: v1
kind: Secret
metadata:
  name: softhsm-secret
  namespace: default
type: Opaque
stringData:
  PKCS11_SLOT_TOKEN_LABEL: "wallet-keys"
  PKCS11_USER_PIN: "123456"
  PKCS11_SO_PIN: "1938456231"
  PKCS11_LIB: "/usr/lib/softhsm/libsofthsm2.so"
  PKCS11_WRAP_KEY_ALIAS: "hsm-wrap-key"

---
# PersistentVolumeClaim for softhsm-tokens volume
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: softhsm-tokens-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName: local-path  # Uncomment to use K3s default local-path provisioner explicitly

---
# Deployment for hsm-worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hsm-worker
  namespace: default
  labels:
    app: hsm-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hsm-worker
  template:
    metadata:
      labels:
        app: hsm-worker
    spec:
      containers:
        - name: hsm-worker
          image: hsm-worker:dev
          imagePullPolicy: IfNotPresent # Use Never if image is loaded locally via: k3s ctr images import

          env:
            - name: RUST_LOG
              value: "info"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "access-kafka-cluster-kafka-bootstrap:9092"

          # .env.softhsm values
          envFrom:
            - secretRef:
                name: softhsm-secret
            - secretRef:
                name: opaque-secret

          volumeMounts:
            - name: softhsm-tokens
              mountPath: /myuser/softhsm/tokens

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      volumes:
        - name: softhsm-tokens
          persistentVolumeClaim:
            claimName: softhsm-tokens-pvc

      restartPolicy: Always
