# =============================================================================
# Headlamp — Kubernetes UI — Kubernetes manifests
# Headlamp is a Kubernetes web UI that provides cluster visibility
# =============================================================================

---
# -----------------------------------------------------------------------------
# Namespace
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp

---
# -----------------------------------------------------------------------------
# ServiceAccount
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: headlamp

---
# -----------------------------------------------------------------------------
# ClusterRoleBinding — gives Headlamp permissions to view cluster resources
# -----------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp

---
# -----------------------------------------------------------------------------
# Deployment
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headlamp
  template:
    metadata:
      labels:
        app: headlamp
    spec:
      serviceAccountName: headlamp

      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:latest
          imagePullPolicy: IfNotPresent

          args:
            - "-in-cluster"

          ports:
            - name: http
              containerPort: 4466
              protocol: TCP

          env:
            - name: TZ
              value: "Europe/Stockholm"

          livenessProbe:
            httpGet:
              path: /
              port: 4466
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 4466
            initialDelaySeconds: 10
            periodSeconds: 5

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

      restartPolicy: Always

---
# -----------------------------------------------------------------------------
# Service
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app: headlamp
spec:
  selector:
    app: headlamp
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 4466
      protocol: TCP

---
# -----------------------------------------------------------------------------
# Ingress — Traefik (k3s default)
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web # port 80
spec:
  ingressClassName: traefik
  rules:
    - host: headlamp.dev.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80
